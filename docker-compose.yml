services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      TH_SECRET_KEY: ${SECRET_KEY}
      TH_DATA_DIR: /data
      TH_UPDATER_URL: ${UPDATER_URL:-http://updater:9000}
      TH_TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      TZ: ${TIMEZONE:-Europe/Berlin}
    volumes:
      # Absoluter Pfad, damit der Ordner auch stimmt, wenn der Update-Dienst den Container neu anlegt
      - ${PROJECT_DIR:-.}/data:/data

  # Führt Updates aus der Administration aus. Kein veröffentlichter Port, nur das Backend erreicht ihn (mit Token).
  # Der Zugriff auf den Docker-Socket entspricht Root-Rechten auf dem Server. Wer das nicht möchte, entfernt
  # diesen Block und aktualisiert mit ./install.sh update im Terminal.
  updater:
    build: ./updater
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      PROJECT_DIR: ${PROJECT_DIR:-}
      TZ: ${TIMEZONE:-Europe/Berlin}
    volumes:
      - .:/project
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
