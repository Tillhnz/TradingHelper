[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradehelper"
version = "0.1.0"
description = "Selbst gehosteter Trading-Assistent: Kurse, News, Chartanalyse, Alarme und Morgenreport"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.1",
    "numpy>=1.26",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
tradehelper = "tradehelper.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tradehelper = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]  # FastAPI Depends() in Defaults ist idiomatisch

[tool.ruff.lint.isort]
known-first-party = ["tradehelper"]
known-local-folder = ["conftest"]
