name: UI-Rauchtest

# Startet den kompletten Stack, ruft die Oberfläche mit echten Kursen im Browser auf und legt Screenshots ab.
# Hängt von Yahoo ab, deshalb blockiert ein Fehlschlag nichts.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ui:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Stack starten
        run: |
          printf 'SECRET_KEY=ci-secret\nPROJECT_DIR=%s\n' "$PWD" > .env
          mkdir -p data && sudo chown 10001:10001 data
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS localhost:8080/api/health && break; sleep 3; done
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Browser-Test
        run: |
          npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.48.2
          # Fallen die Ubuntu-Paketserver aus, reicht meist der Browser allein (Abhängigkeiten sind im Runner-Image)
          timeout 300 npx playwright install --with-deps chromium || npx playwright install chromium
          node .github/scripts/ui-smoke.mjs
      - name: Protokolle
        if: always()
        run: docker compose logs --tail 80 backend
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: shots/
      - name: Screenshots auf Hilfsbranch ui-shots legen (nur Arbeitsbranches)
        if: always() && github.ref != 'refs/heads/main'
        run: |
          cd shots
          git init -q -b ui-shots && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "Screenshots ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-shots
