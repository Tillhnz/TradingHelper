name: Modell-Test

on:
  workflow_dispatch:
  pull_request:
    paths: ["backend/app/brain.py", "backend/app/macro.py", "backend/app/social.py", "backend/app/market.py", ".github/scripts/model_check.py"]
  push:
    branches: [tradehelper-2]
    paths: ["backend/app/brain.py", "backend/app/macro.py", "backend/app/social.py", "backend/app/market.py", ".github/scripts/model_check.py", ".github/workflows/model-check.yml"]

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Echtes Training (mittelfristig)
        run: python .github/scripts/model_check.py
