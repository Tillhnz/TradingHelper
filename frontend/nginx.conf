server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Backend-Adresse bei jedem Zugriff neu nachschlagen: nach einem Update hat der Container oft eine neue IP
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API an das Backend weiterreichen (Report und Update-Prüfung können etwas dauern)
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
        client_max_body_size 1m;
    }

    # Depot-Import: PDF-/CSV-Dateien (als Base64) dürfen größer sein.
    # Bewusst als regulärer Ausdruck nur für die Import-Pfade: Ein Präfix mit Schrägstrich am Ende
    # („/api/portfolio/accounts/“) lässt nginx Anfragen ohne Schrägstrich („POST /api/portfolio/accounts“ =
    # Depot anlegen) per 301 umleiten – der Browser verwirft das, „Depot hinzufügen“ ging dann nicht.
    location ~ ^/api/portfolio/accounts/[0-9]+/import {
        include /etc/nginx/snippets/security-headers.conf;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
        client_max_body_size 60m;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        default_type application/manifest+json;
        try_files $uri =404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Single-Page-App: unbekannte Pfade liefern index.html, das HTML immer frisch (Updates kommen sofort an)
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
